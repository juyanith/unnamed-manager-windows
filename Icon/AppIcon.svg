<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Two keycaps and a ›: press a key, go to the next. The Mac icon's idea, drawn the Windows way:
       no tile, flat layers, one soft gradient lit from the top left, a soft shadow between the keys. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9BCFD"/>
      <stop offset="1" stop-color="#A28BF7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8466F4"/>
      <stop offset="1" stop-color="#5236CF"/>
    </linearGradient>
  </defs>
  <!-- The previous key, behind. -->
  <rect x="16" y="16" width="180" height="180" rx="30" fill="url(#back)"/>
  <!-- A soft shadow on the back key along the front key's top and left edges, lifting it off.
       Only the band over the back key shows; the front key covers the rest. -->
  <path fill="#2A1585" opacity="0.25" d="M 54 90 A 36 36 0 0 1 90 54 H 196 V 196 H 54 Z"/>
  <!-- The front key. -->
  <rect x="60" y="60" width="180" height="180" rx="30" fill="url(#front)"/>
  <!-- The ›, the only detail, on the top layer. -->
  <path fill="#FFFFFF" d="M 120 90 L 160 90 L 205 150 L 160 210 L 120 210 L 165 150 Z"/>
</svg>
