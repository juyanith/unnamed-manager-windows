# Builds the app, runs the unit tests and the self-test on every push and pull request,
# on x64 and on Arm64.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    name: build-and-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP_CI: 1   # SelfTest.Ci: the runner runs as administrator and doesn't hand the app the foreground
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The scripts are written for Windows PowerShell 5.1, as on a dev PC. Each runs as its
      # own process, so the step's $ErrorActionPreference doesn't turn dotnet's stderr into errors.
      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 build

      - name: Unit tests
        run: dotnet test tests/UnnamedManager.Core.Tests --nologo

      # Each FAIL, CRASH or TIMEOUT line also becomes an annotation on the run.
      - name: Self-test
        timeout-minutes: 5
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 selftest | ForEach-Object {
            $_
            if ($_ -match '^(FAIL|CRASH|TIMEOUT)') { "::error title=Self-test::$_" }
          }
          exit $LASTEXITCODE

      # The WPF app links the app's files with no WinUI: a shared file that picks up WinUI
      # breaks this build. --check starts it on a %TEMP% config and exits 0 when it works.
      - name: WPF app
        timeout-minutes: 5
        run: |
          dotnet build src/UnnamedManager.Wpf -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # In %TEMP%: the app refuses a test config anywhere else.
          $dir = Join-Path $env:TEMP "um-wpf-check"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:APP_STORE = Join-Path $dir "config.json"
          $env:APP_LOG = Join-Path $dir "log.txt"
          $exe = Join-Path $env:LOCALAPPDATA "Dev\UnnamedManager\$(Split-Path -Leaf $env:GITHUB_WORKSPACE)\bin\UnnamedManager.Wpf\debug\UnnamedManager.Wpf.exe"
          $run = Start-Process $exe -ArgumentList "--check" -Wait -PassThru
          Get-Content $env:APP_LOG | ForEach-Object {
            $_
            if ($_ -match '^(FAIL|CRASH)') { "::error title=WPF check::$_" }
          }
          exit $run.ExitCode

      - name: Grid checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/grid-lint.ps1
